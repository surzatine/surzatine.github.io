<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="alienSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1c1030"/>
    <stop offset="45%" stop-color="#2a1440"/>
    <stop offset="100%" stop-color="#0b0e14"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffdadb"/>
    <stop offset="60%" stop-color="#ebb2ff"/>
    <stop offset="100%" stop-color="#ebb2ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="dust" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ebb2ff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ebb2ff" stop-opacity="0.12"/>
  </linearGradient>
</defs>
<rect width="800" height="500" fill="url(#alienSky)"/>

<!-- two moons -->
<circle cx="620" cy="90" r="90" fill="url(#sun)"/>
<circle cx="620" cy="90" r="30" fill="#fff3f3" opacity="0.95"/>
<circle cx="150" cy="120" r="26" fill="#dbfcff" opacity="0.5"/>
<circle cx="150" cy="120" r="18" fill="#7df4ff" opacity="0.8"/>

<!-- distant mountains -->
<polygon points="0,300 120,220 240,290 360,200 500,280 650,210 800,270 800,500 0,500" fill="#160b28" opacity="0.9"/>
<polygon points="0,340 150,280 320,330 460,260 620,320 800,290 800,500 0,500" fill="#0d0716"/>

<!-- fog / dust haze -->
<rect x="0" y="300" width="800" height="80" fill="url(#dust)"/>

<!-- mining rig silhouettes -->
<g fill="#05070a">
  <rect x="240" y="240" width="10" height="90"/>
  <rect x="220" y="230" width="50" height="12"/>
  <line x1="225" y1="242" x2="245" y2="300" stroke="#05070a" stroke-width="4"/>
  <line x1="265" y1="242" x2="245" y2="300" stroke="#05070a" stroke-width="4"/>

  <rect x="540" y="260" width="10" height="80"/>
  <rect x="518" y="250" width="54" height="12"/>
  <line x1="524" y1="262" x2="545" y2="320" stroke="#05070a" stroke-width="4"/>
  <line x1="566" y1="262" x2="545" y2="320" stroke="#05070a" stroke-width="4"/>
</g>

<!-- rig warning lights -->
<g fill="#ff8a3d">
  <circle cx="245" cy="234" r="2.5"/>
  <circle cx="545" cy="254" r="2.5"/>
</g>

<!-- foreground rock silhouette -->
<polygon points="0,500 0,410 60,380 140,430 220,400 260,500" fill="#05070a"/>
<polygon points="650,500 700,420 760,440 800,400 800,500" fill="#05070a"/>

<!-- neon dust particles -->
<g fill="#ebb2ff" opacity="0.6">
  <circle cx="380" cy="360" r="1.6"/>
  <circle cx="420" cy="390" r="1.2"/>
  <circle cx="300" cy="370" r="1.4"/>
  <circle cx="500" cy="380" r="1.6"/>
</g>
</svg>
