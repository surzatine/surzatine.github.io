<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a0f2e"/>
    <stop offset="55%" stop-color="#10131a"/>
    <stop offset="100%" stop-color="#0b0e14"/>
  </linearGradient>
  <linearGradient id="glowV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00dbe9" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#00dbe9" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glowP" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ebb2ff" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#ebb2ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="moon" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#dbfcff"/>
    <stop offset="100%" stop-color="#00dbe9" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="500" fill="url(#sky)"/>
<circle cx="640" cy="90" r="120" fill="url(#moon)" opacity="0.35"/>
<circle cx="640" cy="90" r="34" fill="#dbfcff" opacity="0.9"/>

<!-- rain streak lines -->
<g stroke="#7df4ff" stroke-opacity="0.12" stroke-width="1">
  <line x1="40" y1="0" x2="10" y2="500"/>
  <line x1="180" y1="0" x2="150" y2="500"/>
  <line x1="520" y1="0" x2="490" y2="500"/>
  <line x1="700" y1="0" x2="670" y2="500"/>
</g>

<!-- skyline silhouettes -->
<g fill="#0e1119">
  <rect x="0" y="300" width="70" height="200"/>
  <rect x="60" y="230" width="55" height="270"/>
  <rect x="110" y="330" width="90" height="170"/>
  <rect x="195" y="180" width="60" height="320"/>
  <rect x="250" y="260" width="80" height="240"/>
  <rect x="325" y="150" width="50" height="350"/>
  <rect x="370" y="280" width="100" height="220"/>
  <rect x="465" y="200" width="65" height="300"/>
  <rect x="525" y="320" width="85" height="180"/>
  <rect x="605" y="240" width="55" height="260"/>
  <rect x="655" y="300" width="75" height="200"/>
  <rect x="725" y="200" width="75" height="300"/>
</g>

<!-- neon window glows -->
<g>
  <rect x="205" y="200" width="4" height="30" fill="url(#glowV)"/>
  <rect x="215" y="220" width="4" height="60" fill="url(#glowP)"/>
  <rect x="335" y="170" width="4" height="80" fill="url(#glowV)"/>
  <rect x="480" y="220" width="4" height="50" fill="url(#glowP)"/>
  <rect x="615" y="260" width="4" height="70" fill="url(#glowV)"/>
  <rect x="740" y="220" width="4" height="90" fill="url(#glowP)"/>
</g>

<!-- neon signage bars -->
<g stroke-linecap="round">
  <rect x="120" y="360" width="60" height="6" fill="#ebb2ff" opacity="0.9"/>
  <rect x="380" y="320" width="70" height="6" fill="#00dbe9" opacity="0.9"/>
  <rect x="560" y="360" width="50" height="6" fill="#ebb2ff" opacity="0.8"/>
</g>

<!-- reflective ground -->
<rect x="0" y="470" width="800" height="30" fill="#0b0e14"/>
<rect x="0" y="470" width="800" height="30" fill="url(#glowV)" opacity="0.15"/>

<!-- distant flying craft -->
<g fill="#dbfcff" opacity="0.8">
  <ellipse cx="300" cy="90" rx="20" ry="3"/>
  <ellipse cx="470" cy="60" rx="14" ry="2"/>
</g>
</svg>
